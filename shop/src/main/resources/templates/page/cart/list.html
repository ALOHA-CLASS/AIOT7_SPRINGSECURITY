<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">
<head>
  <title>장바구니</title>
</head>
<body layout:fragment="content">
  
  <div class="page-head">
    <h2 class="page-title">CART</h2>
    <p class="page-desc">장바구니</p>
  </div>

  <table class="cart-table" th:if="${!items.empty}">
    <thead>
      <th>상품</th>
      <th>가격</th>
      <th>수량</th>
      <th>합계</th>
      <th>관리</th>
    </thead>
    <tbody>
      <tr th:each="item : ${items.content}" th:attr="data-no=${item.no}">
        <td class="cart-prod">
          <a th:href="|/products/${item.product.id}|">
            <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}" class="cart-thumb">
            <span th:text="${item.product.name}"></span>
          </a>
        </td>
        <td th:text="${ #numbers.formatInteger(item.product.price, 0, 'COMMA') } + '원'">0원</td>
        <td>
          <form th:action="|/cart/${id}/update|" method="post"
               class="qty-form js-qty-form" th:data-no="${item.no}">
            <input type="number" name="quantity" th:value="${item.quantity}" min="1">
            <button type="submit" class="btn-mini">변경</button>
          </form>
        </td>
        <td class="item-total">
          <th:block th:text="${ #numbers.formatInteger(item.product.price * item.quantity, 0, 'COMMA') } + '원' ">0원</th:block>
        </td>
        <td>
          <button type="submit" class="btn-mini danger">삭제</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="class" th:if="${items.empty}">장바구니가 비어 있습니다.</p>

  <!-- 페이지네이션 -->
  <nav class="paging" th:if="${items.totalPages > 0}">

    <!-- 처음 -->
    <a class="pg-btn"
      th:href="${url + '&page=0'}" >
      <span class="material-symbols-outlined">
        keyboard_double_arrow_left
      </span>
    </a>

    <!-- 이전 -->
    <a class="pg-btn"
       th:classappend="${items.first} ? 'disabled'"
       th:href="${url + '&page=' + (items.number - 1)}">
      <span class="material-symbols-outlined">
        chevron_left
      </span>
    </a>

    <!-- 페이지 번호 -->
    <span class="pg-nums">
      <th:block th:with="
        startPage=${(items.number / count) * count},
        endPage=${T(java.lang.Math).min(
          ((items.number / count) * count) + count - 1,
          items.totalPages - 1
        )}
      ">
          <th:block th:each="i : ${ #numbers.sequence(startPage, endPage) }">
            <a th:href="${url + '&page=' + i}"
               th:text="${i + 1}"
               class="pg-num"
               th:classappend="${i == items.number} ? 'on'"
               >1</a>
          </th:block>

      </th:block>
    </span>

    <!-- 다음 -->
    <a class="pg-btn"
       th:classappend="${items.last} ? 'disabled'"
       th:href="${url + '&page=' + (items.number + 1)}">
      <span class="material-symbols-outlined">
        chevron_right
      </span>
    </a>

    <!-- 마지막 -->
    <a class="pg-btn"
       th:href="${url + '&page=' + (items.totalPages - 1)}">
      <span class="material-symbols-outlined">
        keyboard_double_arrow_right
      </span>
    </a>

  </nav>
  

  <!-- 총금액/주문하기 -->
  <div class="cart-summary" th:if="${!items.empty}">
    <p class="total">
      총 결제 금액 
      <b class="cart-total-value" th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')} + '원' ">0원</b>
    </p>
    <a th:href="@{/orders/checkout}" class="btn-fill big">주문하기</a>
  </div>

</body>
</html>
