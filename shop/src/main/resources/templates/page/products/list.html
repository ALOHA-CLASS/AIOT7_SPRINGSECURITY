<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">
<head>
  <title>상품 목록</title>
</head>
<body layout:fragment="content">
  
  <div class="page-head">
    <h2 class="page-title">SHOP</h2>
    <p class="page-desc">전체 상품 목록</p>
  </div>

  <!-- 필터&검색 -->
  <form class="filter" th:action="@{/products}" method="get">
    <select name="category">
      <option value="">전체 카테고리</option>
      <option th:each="c : ${ {'의류', '가방', '액세서리', '시계', '음향', '가전', '뷰티', '스포츠'} }"
              th:value="${c}" th:text="${c}"
              th:selected="${c == productSearch.category}"></option>
    </select>
    <input type="text" name="keyword" th:value="${productSearch.keyword}" placeholder="상품명 검색">
    <button type="submit" class="btn-fill">검색</button>
  </form>

  <!-- 상품 그리드 -->
  <ul class="product-grid">
    <li class="product-card" th:each="p : ${products.content}">
      <a th:href="@{|/products/${p.id}|}">
        <div class="thumb">
          <img th:src="${p.imageUrl}" th:alt="${p.name}">
        </div>
        <div class="info">
          <span class="cate" th:text="${p.category}">카테고리</span>
          <p class="name" th:text="${p.name}">상품명</p>
          <p class="price"><b th:text="${ #numbers.formatInteger(p.price, 0, 'COMMA') }">0</b>원</p>
        </div>
      </a>
    </li>
    <li th:if="${products.empty}" class="empty">검색 결과가 없습니다.</li>
  </ul>

  <!-- 페이지네이션 -->
  <nav class="paging" th:if="${products.totalPages > 0}">

    <!-- 처음 -->
    <!-- th:href="@{/products(page=0, size=${products.size}, count=${count} )}" -->
    <a class="pg-btn"
      th:href="${url + '&page=0'}" >
      <span class="material-symbols-outlined">
        keyboard_double_arrow_left
      </span>
    </a>

    <!-- 이전 -->
    <!-- th:href="@{/products(page=${products.number - 1}, size=${products.size}, count=${count} )}" -->
    <a class="pg-btn"
       th:classappend="${products.first} ? 'disabled'"
       th:href="${url + '&page=' + (products.number - 1)}">
      <span class="material-symbols-outlined">
        chevron_left
      </span>
    </a>

    <!-- 페이지 번호 -->
    <span class="pg-nums">
      <th:block th:with="
        startPage=${(products.number / count) * count},
        endPage=${T(java.lang.Math).min(
          ((products.number / count) * count) + count - 1,
          products.totalPages - 1
        )}
      ">
          <th:block th:each="i : ${ #numbers.sequence(startPage, endPage) }">
            <!-- th:href="@{/products(page=${i}, size=${products.size}, count=${count}, category=${productSearch.category}  )}" -->
            <a th:href="${url + '&page=' + i}"
               th:text="${i + 1}"
               class="pg-num"
               th:classappend="${i == products.number} ? 'on'"
               >1</a>
          </th:block>

      </th:block>
    </span>

    <!-- 다음 -->
    <!-- th:href="@{/products(page=${products.number + 1}, size=${products.size}, count=${count} )}" -->
    <a class="pg-btn"
       th:classappend="${products.last} ? 'disabled'"
       th:href="${url + '&page=' + (products.number + 1)}">
      <span class="material-symbols-outlined">
        chevron_right
      </span>
    </a>

    <!-- 마지막 -->
    <!-- th:href="@{/products(page=${products.totalPages - 1}, size=${products.size}, count=${count} )}" -->
    <a class="pg-btn"
       th:href="${url + '&page=' + (products.totalPages - 1)}">
      <span class="material-symbols-outlined">
        keyboard_double_arrow_right
      </span>
    </a>

  </nav>
</body>
</html>
